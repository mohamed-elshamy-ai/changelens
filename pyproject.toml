[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "changelens"
version = "0.1.0"
description = "Compare two versions of a document and see which changes matter."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["openpyxl>=3.1", "python-docx>=1.1", "pypdfium2>=4.30", "python-pptx>=0.6.23"]

[project.optional-dependencies]
dev = ["pytest", "reportlab"]

[project.scripts]
changelens = "changelens.cli:main"

[tool.setuptools]
packages = ["changelens"]
